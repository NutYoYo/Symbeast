<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SymbeastDex</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0520;color:#e0d8f0;font-family:'Kanit',sans-serif;font-size:14px;line-height:1.6;min-height:100vh}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0d0820}
::-webkit-scrollbar-thumb{background:#3a2a5a;border-radius:3px}

/* Header */
header{background:linear-gradient(135deg,#0d0820,#1a0a30);border-bottom:2px solid #ffd70033;padding:16px 24px;text-align:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
header h1{font-size:28px;font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,#ffd700,#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{font-size:12px;color:#8877aa;letter-spacing:2px}

/* Tab Bar */
#tab-bar{display:flex;gap:4px;padding:12px 16px 0;justify-content:center;flex-wrap:wrap;background:#0d0820;border-bottom:1px solid #2a1a4a}
.tab{padding:8px 20px;border-radius:8px 8px 0 0;cursor:pointer;font-size:14px;font-weight:500;color:#8877aa;border:1px solid transparent;border-bottom:none;transition:all .3s;position:relative;bottom:-1px}
.tab:hover{color:#ccaaee;background:#150a28}
.tab.active{color:#ffd700;background:#0a0520;border-color:#ffd70033;border-bottom-color:#0a0520}

/* Controls */
#controls{background:#0d0820;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;border-bottom:1px solid #2a1a4a}
#search-box{background:#150a28;border:1px solid #3a2a5a;border-radius:8px;padding:8px 14px;color:#e0d8f0;font-family:'Kanit',sans-serif;font-size:14px;width:260px;outline:none;transition:border .3s}
#search-box:focus{border-color:#ffd700}
#search-box::placeholder{color:#5a4a7a}

#filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 12px;border-radius:16px;cursor:pointer;font-size:12px;font-weight:500;border:1px solid #3a2a5a;background:transparent;color:#8877aa;transition:all .25s;font-family:'Kanit',sans-serif}
.chip:hover{border-color:#8877aa;color:#ccaaee}
.chip.active{background:#ffd70015;border-color:#ffd700;color:#ffd700}

/* Sections */
.section{display:none;padding:20px}
.section.active{display:block}

/* Card Grid */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;max-width:1200px;margin:0 auto}

/* Card */
.card{background:linear-gradient(135deg,rgba(20,10,40,0.85),rgba(30,15,50,0.7));border:1px solid rgba(255,215,0,0.12);border-radius:12px;padding:16px;cursor:pointer;transition:all .3s;backdrop-filter:blur(8px);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#ffd70044,transparent)}
.card:hover{transform:translateY(-4px);border-color:#ffd70044;box-shadow:0 8px 32px rgba(255,215,0,0.08)}
.card:active{transform:translateY(-1px)}

.card-icon{font-size:32px;margin-bottom:6px;display:flex;align-items:center;gap:12px}
.card-icon img{width:70px;height:70px;border-radius:8px;object-fit:contain;image-rendering:pixelated;background:rgba(0,0,0,0.25);padding:4px}
.card-name{font-size:15px;font-weight:600;color:#fff;margin-bottom:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-sub{font-size:11px;color:#8877aa;margin-bottom:8px}

.badge{display:inline-block;padding:1px 8px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:0.5px}
.badge-fist{background:#3a1510;color:#ff7755;border:1px solid #5a2520}
.badge-wing{background:#0e2a28;color:#44ddcc;border:1px solid #1a4a44}
.badge-shield{background:#0e1e38;color:#5599ff;border:1px solid #1a3060}
.badge-balance{background:#1a1a2a;color:#aa88dd;border:1px solid #2a2a4a}
.badge-N{background:#1a1a2a;color:#8888aa;border:1px solid #2a2a3a}
.badge-R{background:#1a1010;color:#ffaa44;border:1px solid #3a2010}
.badge-E{background:#0a0a1a;color:#bb88ff;border:1px solid #2a1a4a}

.card-stats{display:flex;flex-direction:column;gap:3px;margin:8px 0}
.stat-row{display:flex;align-items:center;gap:6px;font-size:11px}
.stat-label{width:30px;color:#8877aa;font-weight:500}
.stat-bar-bg{flex:1;height:6px;background:#1a0a28;border-radius:3px;overflow:hidden}
.stat-bar{height:100%;border-radius:3px;transition:width .6s ease}
.stat-bar.atk{background:linear-gradient(90deg,#e74c3c,#ff6b6b)}
.stat-bar.hp{background:linear-gradient(90deg,#2ecc71,#55efc4)}
.stat-bar.spd{background:linear-gradient(90deg,#f1c40f,#fdcb6e)}
.stat-bar.def{background:linear-gradient(90deg,#3498db,#74b9ff)}
.stat-bar.crit{background:linear-gradient(90deg,#a855f7,#c084fc)}
.stat-val{width:28px;text-align:right;font-size:11px;color:#aa99cc}

.card-passive{font-size:11px;color:#aa88cc;border-top:1px solid #2a1a4a;padding-top:6px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.card-effect{font-size:11px;color:#aa88cc;border-top:1px solid #2a1a4a;padding-top:6px;margin-top:4px}
.card-desc{font-size:11px;color:#aa88cc;margin-top:6px}

/* Modal Overlay */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(5,2,16,0.85);backdrop-filter:blur(6px);z-index:200;justify-content:center;align-items:center;padding:20px;animation:fadeIn .25s}
.modal-overlay.show{display:flex}
.modal{background:linear-gradient(135deg,#120a28,#1a0e30);border:1px solid rgba(255,215,0,0.15);border-radius:16px;padding:28px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;position:relative;animation:slideUp .3s ease}
.modal-close{position:absolute;top:12px;right:16px;font-size:24px;cursor:pointer;color:#8877aa;transition:color .3s;background:none;border:none;font-family:'Kanit',sans-serif}
.modal-close:hover{color:#ffd700}

.modal-header{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #2a1a4a;position:relative}
.modal-header img{width:200px;height:200px;border-radius:14px;object-fit:contain;background:rgba(0,0,0,0.3);padding:10px}
.modal-nav{position:absolute;top:100px;width:100%;display:flex;justify-content:space-between;pointer-events:none;padding:0 4px}
.modal-nav-btn{pointer-events:auto;width:36px;height:36px;border-radius:50%;background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.25);color:#ffd700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .3s;font-family:'Kanit',sans-serif}
.modal-nav-btn:hover{background:rgba(255,215,0,0.25);border-color:#ffd700;transform:scale(1.1)}
.modal-nav-btn:disabled{opacity:0.2;cursor:default;transform:none}
.modal-icon{font-size:56px}
.modal-title{font-size:22px;font-weight:700;color:#fff}
.modal-sub{font-size:12px;color:#8877aa;margin-top:-2px}

.modal-body{font-size:14px}
.modal-stats{margin:12px 0 16px}
.modal-passive{background:rgba(255,215,0,0.05);border-left:3px solid #ffd700;padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0}
.modal-passive-en{font-size:13px;color:#ccb}
.modal-passive-th{font-size:12px;color:#9988bb;margin-top:4px}
.modal-section-title{font-size:13px;color:#ffd700;font-weight:600;margin:14px 0 6px;letter-spacing:1px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Count badge */
.count-badge{font-size:11px;color:#8877aa;margin-left:4px}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px;color:#5a4a7a;font-size:15px}
.empty-state .big-icon{font-size:48px;margin-bottom:12px}

/* Responsive */
@media(max-width:768px){.card-grid{grid-template-columns:repeat(2,1fr);gap:10px}.modal{padding:20px;margin:10px}
header h1{font-size:22px}#search-box{width:180px}}
@media(max-width:480px){.card-grid{grid-template-columns:1fr;gap:8px}.card{padding:12px}
header h1{font-size:18px}#tab-bar .tab{font-size:12px;padding:6px 12px}#search-box{width:100%}
.modal{padding:16px}.modal-title{font-size:18px}}

/* Utility */
.mt-4{margin-top:4px}.mb-4{margin-bottom:4px}
.text-gold{color:#ffd700}
.text-muted{color:#8877aa}
.flex{display:flex}
.gap-8{gap:8px}
.items-center{align-items:center}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap">
    <h1>⚔ SymbeastDex</h1>
    <div id="lang-toggle" onclick="toggleLang()" style="cursor:pointer;padding:4px 12px;border-radius:6px;border:1px solid #ffd70044;background:rgba(255,215,0,0.08);color:#ffd700;font-size:12px;font-weight:600;font-family:'Kanit',sans-serif;transition:all .3s">TH</div>
  </div>
  <p>PETS · WEAPONS · ARTIFACTS · ITEMS</p>
</header>

<div id="tab-bar">
  <div class="tab active" data-tab="pet" onclick="switchTab('pet',this)">🐾 Pet</div>
  <div class="tab" data-tab="weapon" onclick="switchTab('weapon',this)">⚔️ Weapon</div>
  <div class="tab" data-tab="artifact" onclick="switchTab('artifact',this)">📿 Artifact</div>
  <div class="tab" data-tab="item" onclick="switchTab('item',this)">📦 Item</div>
</div>

<div id="controls">
  <input id="search-box" type="text" placeholder="🔍 ค้นหา..." oninput="renderActiveTab()">
  <div id="filter-chips"></div>
</div>

<div id="s-pet" class="section active"></div>
<div id="s-weapon" class="section"></div>
<div id="s-artifact" class="section"></div>
<div id="s-item" class="section"></div>

<!-- Modal -->
<div id="modal" class="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div id="modal-inner"></div>
  </div>
</div>

<script>
// ===================== DATA =====================

const PET_BRANCH = {};

const PET_SPRITE = {};

const FORMS = {
  FFF: { name:'BRAWLER',   color:'#e74c3c', hp:88,  atk:22, spd:13, def:5,  passive:'On WIN: next round deals +25% damage', passiveTh:'เมื่อ WIN เทิร์นต่อไปสร้างดาเมจ +25%', passiveIcon:'💢' },
  FFW: { name:'PANDA',     color:'#2ecc71', hp:88,  atk:18, spd:18, def:5,  passive:'On LOSE: next round deals +50% damage', passiveTh:'เมื่อ LOSE เทิร์นต่อไปสร้างดาเมจ +50%', passiveIcon:'🐼' },
  FFS: { name:'IRONJAW',   color:'#95a5a6', hp:108, atk:18, spd:13, def:10, passive:'Damage taken -15%', passiveTh:'ลดดาเมจที่รับ 15%', passiveIcon:'🦖' },
  FWW: { name:'BLITZ',     color:'#f1c40f', hp:80,  atk:15, spd:23, def:5,  passive:'20% chance to dodge attacks', passiveTh:'หลบหลีก 20%', passiveIcon:'⚡' },
  FWS: { name:'CHAMPION',  color:'#9b59b6', hp:75,  atk:16, spd:14, def:8,  passive:'On WIN: ATK +20% and damage received -20% for that round', passiveTh:'เมื่อ WIN ATK +20% ดาเมจรับ -20%', passiveIcon:'🏆' },
  FSS: { name:'FORTRESS',  color:'#2c3e50', hp:120, atk:12, spd:13, def:16, passive:'On DRAW: recover 10% HP', passiveTh:'เมื่อ DRAW ฟื้น 10% HP', passiveIcon:'🏰' },
  WWW: { name:'SPECTER',   color:'#8e44ad', hp:80,  atk:11, spd:29, def:5,  passive:'On DRAW: next attack pierces DEF', passiveTh:'เมื่อ DRAW สร้างดาเมจเจาะเกราะ', passiveIcon:'👻' },
  WWS: { name:'SWIFTGUARD',color:'#3498db', hp:100, atk:11, spd:23, def:10, passive:'+10% damage all modes', passiveTh:'ดาเมจ +10% ทุกรูปแบบ', passiveIcon:'⚡' },
  WSS: { name:'SHIELDWING',color:'#1abc9c', hp:120, atk:11, spd:18, def:16, passive:'Every 3 rounds: damage +50%', passiveTh:'ทุก 3 รอบ ดาเมจ +50%', passiveIcon:'🛡️' },
  SSS: { name:'BASTION',   color:'#2c3e50', hp:105, atk:12, spd:10, def:16, passive:'On LOSE: damage taken -20% for that round', passiveTh:'เมื่อ LOSE ดาเมจรับ -20%', passiveIcon:'🏛️' },
  GHOST:{ name:'GHOST',    color:'#8e44ad', hp:80,  atk:11, spd:29, def:5,  passive:'Random buff at battle start', passiveTh:'สุ่มบัฟตอนเริ่ม', passiveIcon:'👻' },
};

// Branch mapping for base forms (majority symbol)
PET_BRANCH['BRAWLER']='FIST';PET_BRANCH['PANDA']='FIST';PET_BRANCH['IRONJAW']='FIST';
PET_BRANCH['BLITZ']='WING';PET_BRANCH['SPECTER']='WING';PET_BRANCH['SWIFTGUARD']='WING';
PET_BRANCH['SHIELDWING']='SHIELD';PET_BRANCH['BASTION']='SHIELD';PET_BRANCH['FORTRESS']='SHIELD';
PET_BRANCH['CHAMPION']='BALANCE';PET_BRANCH['GHOST']='BALANCE';

PET_SPRITE['BRAWLER']='BRAWLER';PET_SPRITE['PANDA']='PANDA';PET_SPRITE['IRONJAW']='IRONJAW';
PET_SPRITE['BLITZ']='BLITZ';PET_SPRITE['CHAMPION']='CHAMPION';PET_SPRITE['FORTRESS']='FORTRESS';
PET_SPRITE['SPECTER']='SPECTER';PET_SPRITE['SWIFTGUARD']='SWIFTGUARD';PET_SPRITE['SHIELDWING']='SHIELDWING';
PET_SPRITE['BASTION']='BASTION';PET_SPRITE['GHOST']='GHOST';

const EVOLVE2_FORMS = {};

// FIST branch (from BRAWLER)
EVOLVE2_FORMS['RAGING-BRAWLER']={ name:'RAGING-BRAWLER', color:'#ff6644', hp:111, atk:50, spd:14, def:5, passiveIcon:'💢', passive:'On WIN: damage dealt +15% per stack (max 5 stacks per battle, never resets)', passiveTh:'เมื่อ WIN ดาเมจที่สร้างเพิ่มขึ้นครั้งละ 15% (สะสมได้สูงสุด 5 ครั้ง/1 การต่อสู้)' };
EVOLVE2_FORMS['WINDBLADE-BRAWLER']={ name:'WINDBLADE-BRAWLER', color:'#44ccff', hp:104, atk:38, spd:21, def:5, passiveIcon:'🌪️', passive:'25% dodge; on dodge, counter-attacks for 75% damage', passiveTh:'หลบหลีก 25% เมื่อหลบสำเร็จ โต้กลับ 75%' };
EVOLVE2_FORMS['CRIMSON-BRAWLER']={ name:'CRIMSON-BRAWLER', color:'#cc2244', hp:117, atk:41, spd:16, def:6, passiveIcon:'🌹', passive:'Every round (WIN or LOSE): ATK+10% and SPD+10% (max 3 stacks)', passiveTh:'ทุกจบรอบ (WIN หรือ LOSE) ATK+10% และ SPD+10% (สูงสุด 3 ครั้ง)' };
EVOLVE2_FORMS['KAIJU-BRAWLER']={ name:'KAIJU-BRAWLER', color:'#ff8800', hp:137, atk:36, spd:13, def:8, passiveIcon:'🦖', passive:'On LOSE: next round ATK+50%, DEF+50%, and 25% chance to burn the enemy', passiveTh:'เมื่อ LOSE เทิร์นถัดไป ATK+50% DEF+50% และมีโอกาส 25% เผาศัตรู' };
PET_BRANCH['RAGING-BRAWLER']='FIST';PET_BRANCH['WINDBLADE-BRAWLER']='WING';PET_BRANCH['CRIMSON-BRAWLER']='BALANCE';PET_BRANCH['KAIJU-BRAWLER']='SHIELD';
PET_SPRITE['RAGING-BRAWLER']='RAGING-BRAWLER';PET_SPRITE['WINDBLADE-BRAWLER']='WINDBLADE-BRAWLER';PET_SPRITE['CRIMSON-BRAWLER']='CRIMSON-BRAWLER';PET_SPRITE['KAIJU-BRAWLER']='KAIJU-BRAWLER';

// WING branch (from PANDA)
EVOLVE2_FORMS['FIGHTER-PANDA']={ name:'FIGHTER-PANDA', color:'#ff6644', hp:111, atk:42, spd:19, def:5, passiveIcon:'🥊', passive:'On LOSE: damage dealt +75% this round', passiveTh:'เมื่อ LOSE ดาเมจที่สร้างในเทิร์นนี้ +75%' };
EVOLVE2_FORMS['PANDA-NINJA']={ name:'PANDA-NINJA', color:'#44ccff', hp:104, atk:32, spd:29, def:5, passiveIcon:'🥷', passive:'25% dodge; on dodge, next attack is guaranteed crit (×1.6)', passiveTh:'หลบหลีก 25% เมื่อหลบสำเร็จ โจมตีครั้งถัดไปคริติคอล (x1.6)' };
EVOLVE2_FORMS['PANDA-WARRIOR']={ name:'PANDA-WARRIOR', color:'#bb44ff', hp:117, atk:35, spd:22, def:6, passiveIcon:'⚔️', passive:'25% chance to take half damage and counter for 75% damage', passiveTh:'25% โอกาสรับดาเมจครึ่งเดียวและโต้กลับ 75%' };
EVOLVE2_FORMS['ARMOR-PANDA']={ name:'ARMOR-PANDA', color:'#5588dd', hp:137, atk:30, spd:18, def:8, passiveIcon:'🛡️', passive:'All damage taken -20%; 50% chance to counter for 75% when hit', passiveTh:'ลดดาเมจทั้งหมด 20% มีโอกาส 50% โต้กลับ 75% เมื่อโดนโจมตี' };
PET_BRANCH['FIGHTER-PANDA']='FIST';PET_BRANCH['PANDA-NINJA']='WING';PET_BRANCH['PANDA-WARRIOR']='BALANCE';PET_BRANCH['ARMOR-PANDA']='SHIELD';
PET_SPRITE['FIGHTER-PANDA']='FIGHTER-PANDA';PET_SPRITE['PANDA-NINJA']='PANDA-NINJA';PET_SPRITE['PANDA-WARRIOR']='PANDA-WARRIOR';PET_SPRITE['ARMOR-PANDA']='ARMOR-PANDA';

// SHIELD branch (from IRONJAW)
EVOLVE2_FORMS['TYRANT-IRONJAW']={ name:'TYRANT-IRONJAW', color:'#ff6644', hp:136, atk:42, spd:14, def:10, passiveIcon:'🦖', passive:'Damage dealt +20% and lifesteal +10%', passiveTh:'ดาเมจที่สร้าง +20% และดูดเลือด 10%' };
EVOLVE2_FORMS['AGILE-IRONJAW']={ name:'AGILE-IRONJAW', color:'#cc6644', hp:128, atk:32, spd:21, def:10, passiveIcon:'🏃', passive:'25% chance to attack twice, 15% chance to dodge', passiveTh:'25% โอกาสโจมตี 2 ครั้ง และ 15% โอกาสหลบหลีก' };
EVOLVE2_FORMS['RUNE-IRONJAW']={ name:'RUNE-IRONJAW', color:'#cc44ff', hp:144, atk:35, spd:16, def:12, passiveIcon:'🔮', passive:'15% stun; random Rune buff each round: ATK+50% or DEF+50% (non-stacking)', passiveTh:'15% สตัน; สุ่ม Rune แต่ละรอบ: ATK+50% หรือ DEF+50%' };
EVOLVE2_FORMS['FULLARMOR-IRONJAW']={ name:'FULLARMOR-IRONJAW', color:'#5588dd', hp:168, atk:30, spd:13, def:17, passiveIcon:'⛓️', passive:'HP<50%: damage taken -20% and counter for 75% every round', passiveTh:'HP<50%: ลดดาเมจ 20% และโต้กลับ 75% ทุกรอบ' };
PET_BRANCH['TYRANT-IRONJAW']='FIST';PET_BRANCH['AGILE-IRONJAW']='WING';PET_BRANCH['RUNE-IRONJAW']='BALANCE';PET_BRANCH['FULLARMOR-IRONJAW']='SHIELD';
PET_SPRITE['TYRANT-IRONJAW']='TYRANT-IRONJAW';PET_SPRITE['AGILE-IRONJAW']='AGILE-IRONJAW';PET_SPRITE['RUNE-IRONJAW']='RUNE-IRONJAW';PET_SPRITE['FULLARMOR-IRONJAW']='FULLARMOR-IRONJAW';

// BALANCE branch (from BLITZ)
EVOLVE2_FORMS['STRONG-BLITZ']={ name:'STRONG-BLITZ', color:'#ff6644', hp:102, atk:34, spd:24, def:5, passiveIcon:'💪', passive:'On WIN: damage dealt +20% and 15% chance to stun for 1 round', passiveTh:'เมื่อ WIN ดาเมจที่สร้าง +20% และ 15% สตัน 1 เทิร์น' };

  'PANDA-GHOST':{name:'PANDA ECHO',icon:'☯️',desc:'Crit+15%; 10% chance to stun on hit',descTh:'Crit+15% 10% สตันเมื่อโจมตี'},
};

// ===================== RENDER LOGIC =====================

let currentTab = 'pet';
let currentFilter = 'all';
let filteredPetList = []; // for modal prev/next
let dexLang = 'th'; // 'th' or 'en'

function t(th, en) { return dexLang === 'th' ? th : en; }
function toggleLang() {
  dexLang = dexLang === 'th' ? 'en' : 'th';
  document.getElementById('lang-toggle').textContent = dexLang.toUpperCase();
  renderActiveTab();
  // Refresh modal if open
  const modal = document.getElementById('modal');
  if (modal.classList.contains('show')) {
    // Re-open by simulating click on current modal's source - handled by renderActiveTab refresh
    // For now, just close modal to avoid stale content
    closeModal();
  }
}

const BRANCHES = ['FIST','WING','SHIELD','BALANCE'];
const GRADES = ['N','R','E'];

const BRANCH_COLORS = { FIST:'#ff7755', WING:'#44ddcc', SHIELD:'#5599ff', BALANCE:'#aa88dd' };
const GRADE_COLORS = { N:'#8888aa', R:'#ffaa44', E:'#bb88ff' };

function getPetBranch(name) {
  return PET_BRANCH[name] || 'BALANCE';
}

function getSpritePath(name) {
  const key = PET_SPRITE[name] || name;
  return 'Pet/' + key + '.png';
}

function getAllPets() {
  const pets = [];
  // Base forms
  for (const [key, data] of Object.entries(FORMS)) {
    if (key === 'GHOST') continue;
    pets.push({ key: data.name, ...data, formType: 'Base', branch: getPetBranch(data.name), spriteKey: PET_SPRITE[data.name] || data.name });
  }
  // Evolve II
  for (const [key, data] of Object.entries(EVOLVE2_FORMS)) {
    pets.push({ key: data.name, ...data, formType: 'Evolve II', branch: getPetBranch(data.name), spriteKey: PET_SPRITE[data.name] || data.name });
  }
  // Ghost
  pets.push({ key: 'GHOST', ...FORMS['GHOST'], formType: 'Base', branch: getPetBranch('GHOST'), spriteKey: 'GHOST' });
  for (const [key, data] of Object.entries(GHOST_FORMS)) {
    pets.push({ key: data.name, ...data, formType: 'Ghost', branch: getPetBranch(data.name), spriteKey: PET_SPRITE[data.name] || data.name });
  }
  return pets;
}

function getAllWeapons() {
  return Object.entries(WEAPONS).map(([key, data]) => ({ key, ...data }));
}

function getAllArtifacts() {
  return ARTIFACTS.map(a => ({ ...a }));
}

function getAllItems() {
  return ITEMS.map(i => ({ ...i }));
}

function renderStatBar(label, value, cls, maxVal) {
  const pct = Math.min(100, (value / maxVal) * 100);
  return `<div class="stat-row">
    <span class="stat-label">${label}</span>
    <div class="stat-bar-bg"><div class="stat-bar ${cls}" style="width:${pct}%"></div></div>
    <span class="stat-val">${value}</span>
  </div>`;
}

function getGradeBadge(grade) {
  return `<span class="badge badge-${grade}">${grade}</span>`;
}

function getBranchBadge(branch) {
  const color = BRANCH_COLORS[branch] || '#aa88dd';
  return `<span class="badge" style="background:${color}22;color:${color};border-color:${color}44">${branch}</span>`;
}

// ===================== CARD RENDERERS =====================

function renderPetCard(pet) {
  const branch = pet.branch;
  const branchBadge = getBranchBadge(branch);
  const imgTag = `<img src="${getSpritePath(pet.name)}" alt="${pet.name}" onerror="this.style.display='none'">`;
  const od = OVERDRIVE_INFO[pet.name];
  const odHtml = od ? `<div style="margin-top:6px;padding:5px 8px;background:#0a0a1c;border-radius:6px;border:1px solid #ff660033"><span style="font-size:10px;color:#ff6600">⚡ ${od.icon} ${od.name}</span></div>` : '';
  return `<div class="card" onclick="showPetModal('${pet.name}')">
    <div class="card-icon">${imgTag}</div>
    <div class="card-name">${pet.name} ${branchBadge}<span style="font-size:10px;color:#8877aa;font-weight:400">${pet.formType}</span></div>
    <div class="card-sub" style="color:#8877aa">HP:${pet.hp} ATK:${pet.atk} SPD:${pet.spd} DEF:${pet.def}</div>
    <div class="card-stats">
      ${renderStatBar('HP',pet.hp,'hp',250)}
      ${renderStatBar('ATK',pet.atk,'atk',60)}
      ${renderStatBar('SPD',pet.spd,'spd',50)}
      ${renderStatBar('DEF',pet.def,'def',40)}
    </div>
    <div class="card-passive">${dexLang==='th' ? (pet.passiveTh||pet.passive) : pet.passive}</div>
    ${odHtml}
  </div>`;
}

function renderWeaponCard(w) {
  const statsStr = Object.entries(w.stats).map(([k,v]) => k.toUpperCase()+':+'+v).join(' ');
  const gradeBadge = getGradeBadge(w.grade);
  const effDesc = w.desc ? `<div class="card-effect">${w.desc}</div>` : '';
  return `<div class="card" onclick="showWeaponModal('${w.key}')">
    <div class="card-icon"><span style="font-size:28px">${w.icon}</span></div>
    <div class="card-name">${w.name} ${gradeBadge}</div>
    <div class="card-sub">${w.nameTh} · ${statsStr}</div>
    ${effDesc}
  </div>`;
}

function renderArtifactCard(a) {
  const gradeBadge = getGradeBadge(a.grade);
  return `<div class="card" onclick="showArtifactModal('${a.key}')">
    <div class="card-icon"><span style="font-size:28px">${a.icon}</span></div>
    <div class="card-name">${a.name} ${gradeBadge}</div>
    <div class="card-sub">${a.nameTh}</div>
    <div class="card-desc">${a.desc}</div>
  </div>`;
}

function renderItemCard(item) {
  return `<div class="card" onclick="showItemModal('${item.key}')">
    <div class="card-icon"><span style="font-size:28px">${item.icon}</span></div>
    <div class="card-name">${item.name}</div>
    <div class="card-sub">${item.nameTh}</div>
    <div class="card-desc">${item.desc}</div>
  </div>`;
}

// ===================== TAB & FILTER =====================

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('s-' + tab).classList.add('active');
  updateFilterChips();
  renderActiveTab();
}

function updateFilterChips() {
  const container = document.getElementById('filter-chips');
  let chips = '<div class="chip active" data-filter="all" onclick="setFilter(\'all\',this)">All</div>';

  if (currentTab === 'pet') {
    for (const b of BRANCHES) {
      chips += `<div class="chip" data-filter="${b}" onclick="setFilter('${b}',this)" style="color:${BRANCH_COLORS[b]}">${b}</div>`;
    }
  } else if (currentTab === 'weapon' || currentTab === 'artifact') {
    for (const g of GRADES) {
      chips += `<div class="chip" data-filter="${g}" onclick="setFilter('${g}',this)" style="color:${GRADE_COLORS[g]}">${g}</div>`;
    }
  }
  container.innerHTML = chips;
}

function setFilter(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('#filter-chips .chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  renderActiveTab();
}

function getSearchTerm() {
  return document.getElementById('search-box').value.toLowerCase().trim();
}

// ===================== MAIN RENDER =====================

function renderActiveTab() {
  const term = getSearchTerm();
  const filter = currentFilter;
  const container = document.getElementById('s-' + currentTab);

  if (currentTab === 'pet') {
    renderPets(container, term, filter);
  } else if (currentTab === 'weapon') {
    renderWeapons(container, term, filter);
  } else if (currentTab === 'artifact') {
    renderArtifacts(container, term, filter);
  } else if (currentTab === 'item') {
    renderItems(container, term);
  }
}

function renderPets(container, term, filter) {
  let pets = getAllPets();
  if (filter !== 'all') pets = pets.filter(p => p.branch === filter);
  if (term) pets = pets.filter(p => p.name.toLowerCase().includes(term) || (p.passive||'').toLowerCase().includes(term));
  filteredPetList = pets.map(p => p.name);

  if (!pets.length) {
    container.innerHTML = `<div class="empty-state"><div class="big-icon">🔍</div>ไม่พบสัตว์ที่ค้นหา</div>`;
    return;
  }

  let html = `<div class="card-grid">`;
  for (const p of pets) html += renderPetCard(p);
  html += `</div>`;
  html += `<div style="text-align:center;padding:12px;color:#5a4a7a;font-size:12px">พบ ${pets.length} ตัว</div>`;
  container.innerHTML = html;
}

function renderWeapons(container, term, filter) {
  let weapons = getAllWeapons();
  if (filter !== 'all') weapons = weapons.filter(w => w.grade === filter);
  if (term) weapons = weapons.filter(w => w.name.toLowerCase().includes(term) || w.nameTh.includes(term) || (w.desc||'').toLowerCase().includes(term));

  if (!weapons.length) {
    container.innerHTML = `<div class="empty-state"><div class="big-icon">🔍</div>ไม่พบอาวุธที่ค้นหา</div>`;
    return;
  }

  let html = `<div class="card-grid">`;
  for (const w of weapons) html += renderWeaponCard(w);
  html += `</div>`;
  html += `<div style="text-align:center;padding:12px;color:#5a4a7a;font-size:12px">พบ ${weapons.length} ชิ้น</div>`;
  container.innerHTML = html;
}

function renderArtifacts(container, term, filter) {
  let arts = getAllArtifacts();
  if (filter !== 'all') arts = arts.filter(a => a.grade === filter);
  if (term) arts = arts.filter(a => a.name.toLowerCase().includes(term) || a.nameTh.includes(term) || a.desc.toLowerCase().includes(term));

  if (!arts.length) {
    container.innerHTML = `<div class="empty-state"><div class="big-icon">🔍</div>ไม่พบอาติแฟคที่ค้นหา</div>`;
    return;
  }

  let html = `<div class="card-grid">`;
  for (const a of arts) html += renderArtifactCard(a);
  html += `</div>`;
  html += `<div style="text-align:center;padding:12px;color:#5a4a7a;font-size:12px">พบ ${arts.length} ชิ้น</div>`;
  container.innerHTML = html;
}

function renderItems(container, term) {
  let items = getAllItems();
  if (term) items = items.filter(i => i.name.toLowerCase().includes(term) || i.nameTh.includes(term) || i.desc.toLowerCase().includes(term));

  if (!items.length) {
    container.innerHTML = `<div class="empty-state"><div class="big-icon">🔍</div>ไม่พบไอเทมที่ค้นหา</div>`;
    return;
  }

  let html = `<div class="card-grid">`;
  for (const i of items) html += renderItemCard(i);
  html += `</div>`;
  html += `<div style="text-align:center;padding:12px;color:#5a4a7a;font-size:12px">พบ ${items.length} ชิ้น</div>`;
  container.innerHTML = html;
}

// ===================== MODALS =====================

function openModal() {
  document.getElementById('modal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('modal').classList.remove('show');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

function showPetModal(name, dir) {
  // If called with dir, find prev/next from filteredPetList
  if (dir && filteredPetList.length) {
    const idx = filteredPetList.indexOf(name);
    if (idx >= 0) {
      let newIdx = idx + (dir === 'prev' ? -1 : 1);
      if (newIdx < 0) newIdx = filteredPetList.length - 1;
      if (newIdx >= filteredPetList.length) newIdx = 0;
      name = filteredPetList[newIdx];
    }
  }
  let pet = null;
  for (const [,d] of Object.entries(FORMS)) { if (d.name === name) { pet = {...d, formType:'Base', key:name}; break; } }
  if (!pet) for (const [,d] of Object.entries(EVOLVE2_FORMS)) { if (d.name === name) { pet = {...d, formType:'Evolve II', key:name}; break; } }
  if (!pet) for (const [,d] of Object.entries(GHOST_FORMS)) { if (d.name === name) { pet = {...d, formType:'Ghost', key:name}; break; } }
  if (!pet) return;

  const branch = getPetBranch(name);
  const branchBadge = getBranchBadge(branch);
  const spritePath = getSpritePath(name);
  const maxHp = 250, maxAtk = 60, maxSpd = 50, maxDef = 40;
  const gradeLabel = { 'Base':'Base Form', 'Evolve II':'Evolve II', 'Ghost':'Ghost' }[pet.formType] || pet.formType;
  const curIdx = filteredPetList.indexOf(name);
  const prevDisabled = curIdx <= 0 ? 'disabled' : '';
  const nextDisabled = curIdx >= filteredPetList.length - 1 ? 'disabled' : '';
  const od = OVERDRIVE_INFO[name];
  const odHtml = od ? `<div class="modal-section-title">⚡ OVERDRIVE — ${od.icon} ${od.name}</div><div class="modal-passive"><div style="font-size:13px;color:#ccb">${dexLang==='th'?od.descTh:od.desc}</div></div>` : '';
  const echo = FUSION_ECHO_INFO[name];
  const echoHtml = echo ? `<div class="modal-section-title">🧬 ${t('ECHO','FUSION ECHO')} — ${echo.icon} ${echo.name}</div><div class="modal-passive" style="border-left-color:#44aaff"><div style="font-size:13px;color:#ccb">${dexLang==='th'?echo.descTh:echo.desc}</div></div>` : '';

  const inner = `
    <div class="modal-header">
      <img src="${spritePath}" alt="${name}" onerror="this.style.display='none'">
      <div class="modal-nav">
        <button class="modal-nav-btn" ${prevDisabled} onclick="showPetModal('${name}','prev')">&lsaquo;</button>
        <button class="modal-nav-btn" ${nextDisabled} onclick="showPetModal('${name}','next')">&rsaquo;</button>
      </div>
      <div style="text-align:center">
        <div class="modal-title">${name}</div>
        <div class="modal-sub">${branchBadge} <span style="color:#8877aa;font-size:11px">${gradeLabel}</span>${filteredPetList.length > 0 ? ` <span style="color:#5a4a7a;font-size:11px">· ${curIdx+1}/${filteredPetList.length}</span>` : ''}</div>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-section-title">${t('📊 สเตตัส','📊 Stats')}</div>
      <div class="modal-stats">
        ${renderStatBar('HP',pet.hp,'hp',maxHp)}
        ${renderStatBar('ATK',pet.atk,'atk',maxAtk)}
        ${renderStatBar('SPD',pet.spd,'spd',maxSpd)}
        ${renderStatBar('DEF',pet.def,'def',maxDef)}
      </div>
      <div class="modal-section-title">${t('⭐ ความสามารถติดตัว','⭐ Passive')}</div>
      <div class="modal-passive">
        <div style="font-size:13px;color:#ccb">${dexLang==='th' ? pet.passiveTh : pet.passive}</div>
      </div>
      ${odHtml}
      ${echoHtml}
    </div>
  `;
  document.getElementById('modal-inner').innerHTML = inner;
  openModal();
}

function showWeaponModal(key) {
  const w = WEAPONS[key];
  if (!w) return;
  const gradeBadge = getGradeBadge(w.grade);
  const statsStr = Object.entries(w.stats).map(([k,v]) => `<div class="stat-row"><span class="stat-label">${k.toUpperCase()}</span><span style="color:#44dd88">+${v}</span></div>`).join('');
  const wName = dexLang==='th' ? w.nameTh : w.name;

  let effHtml = '';
  if (w.effect) {
    effHtml = `<div class="modal-section-title">⚡ ${t('เอฟเฟกต์','Effect')}</div>
      <div class="modal-passive">
        <div style="font-size:13px;color:#ccb">${dexLang==='th' ? w.descTh : w.desc}</div>
      </div>`;
  }

  const inner = `
    <div class="modal-header">
      <span class="modal-icon">${w.icon}</span>
      <div>
        <div class="modal-title">${wName}</div>
        <div class="modal-sub">${gradeBadge} <span style="color:#8877aa">${dexLang==='th' ? w.name : w.nameTh}</span></div>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-section-title">${t('📊 สเตตัส','📊 Stats')}</div>
      <div class="modal-stats">${statsStr}</div>
      ${effHtml}
    </div>
  `;
  document.getElementById('modal-inner').innerHTML = inner;
  openModal();
}

function showArtifactModal(key) {
  const a = ARTIFACTS.find(x => x.key === key);
  if (!a) return;
  const gradeBadge = getGradeBadge(a.grade);
  const aName = dexLang==='th' ? a.nameTh : a.name;

  const inner = `
    <div class="modal-header">
      <span class="modal-icon">${a.icon}</span>
      <div>
        <div class="modal-title">${aName}</div>
        <div class="modal-sub">${gradeBadge} <span style="color:#8877aa">${dexLang==='th' ? a.name : a.nameTh}</span></div>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-section-title">📜 ${t('รายละเอียด','Details')}</div>
      <div class="modal-passive">
        <div style="font-size:13px;color:#ccb">${dexLang==='th' ? a.descTh : a.desc}</div>
      </div>
    </div>
  `;
  document.getElementById('modal-inner').innerHTML = inner;
  openModal();
}

function showItemModal(key) {
  const item = ITEMS.find(x => x.key === key);
  if (!item) return;
  const iName = dexLang==='th' ? item.nameTh : item.name;

  const inner = `
    <div class="modal-header">
      <span class="modal-icon">${item.icon}</span>
      <div>
        <div class="modal-title">${iName}</div>
        <div class="modal-sub"><span style="color:#8877aa">${dexLang==='th' ? item.name : item.nameTh}</span></div>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-section-title">📜 ${t('รายละเอียด','Details')}</div>
      <div class="modal-passive">
        <div style="font-size:13px;color:#ccb">${dexLang==='th' ? item.descTh : item.desc}</div>
      </div>
    </div>
  `;
  document.getElementById('modal-inner').innerHTML = inner;
  openModal();
}

// ===================== INIT =====================
updateFilterChips();
renderActiveTab();
</script>
</body>
</html>
